# Remakes the download zips when a resource folder changes, and saves them.
name: download zips
on:
  push:
    branches: [main]
    paths: ["skills/**", "tools/make-zips.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/make-zips.py
      - name: Save the zips if they changed
        run: |
          if [ -n "$(git status --porcelain downloads)" ]; then
            git config user.name "zips-bot"
            git config user.email "zips-bot@users.noreply.github.com"
            git add downloads
            git commit -m "Remake download zips"
            git push
          else
            echo "zips already up to date"
          fi
